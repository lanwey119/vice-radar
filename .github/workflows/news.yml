name: Radar de noticias
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar-news
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_news.py
      - run: |
          git config user.name 'Vice Radar Bot'
          git config user.email 'vice-radar-bot@users.noreply.github.com'
          git add news.json
          git diff --cached --quiet || (git commit -m 'Actualizar radar' && git push)
