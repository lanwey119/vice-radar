name: VICE RADAR V3 editorial review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-editorial-v3.yml'
      - 'scripts/render_editorial_v3.py'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'kokoro==0.9.4' soundfile numpy pillow faster-whisper
      - run: python scripts/render_editorial_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: vice-radar-v3-review
          path: output/
          retention-days: 3
